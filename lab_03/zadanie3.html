<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Zadanie 3 - API Products</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .controls { margin-bottom: 20px; padding: 10px; background: #f0f0f0; border-radius: 5px; }
        input, select { padding: 8px; margin-right: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #333; color: white; }
        img { width: 50px; height: 50px; object-fit: cover; border-radius: 4px; }
    </style>
</head>
<body>

    <div class="controls">
        <input type="text" id="searchInput" placeholder="Filtruj (tytuł lub opis)...">
        <select id="sortSelect">
            <option value="original">Oryginalna kolejność</option>
            <option value="asc">Rosnąco (A-Z)</option>
            <option value="desc">Malejąco (Z-A)</option>
        </select>
    </div>

    <table>
        <thead>
            <tr>
                <th>Zdjęcie</th>
                <th>Tytuł</th>
                <th>Opis</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            </tbody>
    </table>

    <script>
        let originalData = []; //pobrane dane

        //pobieranie danych (async/await)
        async function fetchProducts() {
            try {
                const response = await fetch('https://dummyjson.com/products');
                const data = await response.json();
                
                //pierwsze 30 elementow
                originalData = data.products.slice(0, 30);
                
                // pierwsze renderowanie
                renderTable(originalData);
            } catch (error) {
                console.error("Błąd pobierania danych:", error);
            }
        }

        // 2. Funkcja renderujaca tabele (createElement / appendChild)
        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = ""; // czyscimy stare elementy

            data.forEach(product => {
                const tr = document.createElement('tr');

                // kolumna Zdjęcie
                const tdImg = document.createElement('td');
                const img = document.createElement('img');
                img.src = product.thumbnail;
                img.alt = product.title;
                tdImg.appendChild(img);
                tr.appendChild(tdImg);

                // kolumna Tytul
                const tdTitle = document.createElement('td');
                tdTitle.textContent = product.title;
                tr.appendChild(tdTitle);

                // kolumna Opis
                const tdDesc = document.createElement('td');
                tdDesc.textContent = product.description;
                tr.appendChild(tdDesc);

                tbody.appendChild(tr);
            });
        }

        function filterAndSort() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const sortMode = document.getElementById('sortSelect').value;

        
            // filter tworzy kopie
            let processedData = originalData.filter(item => 
                item.title.toLowerCase().includes(searchTerm) || 
                item.description.toLowerCase().includes(searchTerm)
            );

            //sortowanie
            if (sortMode !== 'original') {
                processedData = [...processedData].sort((a, b) => {
                    if (sortMode === 'asc') {
                        return a.title.localeCompare(b.title);
                    } else {
                        return b.title.localeCompare(a.title);
                    }
                });
            }

            // Renderujemy kopie danych
            renderTable(processedData);
        }

        document.getElementById('searchInput').addEventListener('input', filterAndSort);
        document.getElementById('sortSelect').addEventListener('change', filterAndSort);

        fetchProducts();
    </script>
</body>
</html>
