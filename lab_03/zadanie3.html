<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Zadanie 3 - API Products</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .controls { margin-bottom: 20px; padding: 10px; background: #f0f0f0; border-radius: 5px; }
        input, select { padding: 8px; margin-right: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #333; color: white; }
        img { width: 50px; height: 50px; object-fit: cover; border-radius: 4px; }
    </style>
</head>
<body>

    <div class="controls">
        <input type="text" id="searchInput" placeholder="Filtruj (tytuł lub opis)...">
        <select id="sortSelect">
            <option value="original">Oryginalna kolejność</option>
            <option value="asc">Rosnąco (A-Z)</option>
            <option value="desc">Malejąco (Z-A)</option>
        </select>
    </div>

    <table>
        <thead>
            <tr>
                <th>Zdjęcie</th>
                <th>Tytuł</th>
                <th>Opis</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            </tbody>
    </table>

    <script>
        let originalData = []; // Tutaj przechowamy pobrane dane

        // 1. Pobieranie danych (async/await)
        async function fetchProducts() {
            try {
                const response = await fetch('https://dummyjson.com/products');
                const data = await response.json();
                
                // Bierzemy tylko pierwsze 30 elementów
                originalData = data.products.slice(0, 30);
                
                // Pierwsze renderowanie
                renderTable(originalData);
            } catch (error) {
                console.error("Błąd pobierania danych:", error);
                alert("Nie udało się pobrać danych.");
            }
        }

        // 2. Funkcja renderująca tabelę (createElement / appendChild)
        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = ""; // Czyścimy stare elementy (zgodnie z instrukcją)

            data.forEach(product => {
                const tr = document.createElement('tr');

                // Kolumna Zdjęcie
                const tdImg = document.createElement('td');
                const img = document.createElement('img');
                img.src = product.thumbnail;
                img.alt = product.title;
                tdImg.appendChild(img);
                tr.appendChild(tdImg);

                // Kolumna Tytuł
                const tdTitle = document.createElement('td');
                tdTitle.textContent = product.title;
                tr.appendChild(tdTitle);

                // Kolumna Opis
                const tdDesc = document.createElement('td');
                tdDesc.textContent = product.description;
                tr.appendChild(tdDesc);

                tbody.appendChild(tr);
            });
        }

// 3. Logika filtrowania i sortowania (Best Practices)
function filterAndSort() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const sortMode = document.getElementById('sortSelect').value;

            // KROK 1: FILTROWANIE
            // .filter() tworzy nową tablicę (płytką kopię), więc originalData jest bezpieczne.
            // Tworzymy zmienną lokalną 'processedData'.
            let processedData = originalData.filter(item => 
                item.title.toLowerCase().includes(searchTerm) || 
                item.description.toLowerCase().includes(searchTerm)
            );

            // KROK 2: SORTOWANIE
            // sort() działa "in-place" (zmienia tablicę, na której jest wywoływany).
            // Mimo że processedData to już nowa tablica (z filtra), 
            // dobrą praktyką jest jawne utworzenie kopii przed sortowaniem,
            // zwłaszcza jeśli w przyszłości usunęlibyśmy filtr.
            
            if (sortMode !== 'original') {
                // [...processedData] tworzy nową tablicę z elementów starej
                processedData = [...processedData].sort((a, b) => {
                    if (sortMode === 'asc') {
                        return a.title.localeCompare(b.title);
                    } else {
                        return b.title.localeCompare(a.title);
                    }
                });
            }

            // KROK 3: Renderujemy KOPIĘ danych, a nie oryginał
            renderTable(processedData);
        }

        // Dodanie Event Listenerów
        document.getElementById('searchInput').addEventListener('input', filterAndSort);
        document.getElementById('sortSelect').addEventListener('change', filterAndSort);

        // Start
        fetchProducts();
    </script>
</body>
</html>
