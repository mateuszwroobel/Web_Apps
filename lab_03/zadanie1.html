<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Zadanie 1 - Stoper</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 50px; }
        #timer { font-size: 48px; font-weight: bold; margin-bottom: 20px; }
        button { font-size: 18px; padding: 10px 20px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="timer">0s</div>
    
    <button id="btnStart">Start</button>
    <button id="btnStop">Stop</button>
    <button id="btnReset">Reset</button>

    <script>
        // Zmienne do przechowywania stanu stopera
        let startTime = 0;
        let elapsedTime = 0;
        let timerInterval = null;

        const timerDisplay = document.getElementById('timer');

        // Funkcja formatująca czas zgodnie z wymaganiem (Xmin Xs lub Xs)
        function formatTime(timeInMilliseconds) {
            const totalSeconds = Math.floor(timeInMilliseconds / 1000);
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;

            if (minutes > 0) {
                return `${minutes}min ${seconds}s`;
            } else {
                return `${seconds}s`;
            }
        }

        function updateDisplay() {
            const now = Date.now();
            const timePassed = elapsedTime + (now - startTime);
            timerDisplay.textContent = formatTime(timePassed);
        }

        document.getElementById('btnStart').addEventListener('click', () => {
            if (!timerInterval) { // Zapobiega wielokrotnemu kliknięciu start
                startTime = Date.now();
                timerInterval = setInterval(() => {
                    const now = Date.now();
                    const currentTotal = elapsedTime + (now - startTime);
                    timerDisplay.textContent = formatTime(currentTotal);
                }, 100); // Odświeżanie co 100ms
            }
        });

        document.getElementById('btnStop').addEventListener('click', () => {
            if (timerInterval) {
                clearInterval(timerInterval);
                elapsedTime += Date.now() - startTime;
                timerInterval = null;
            }
        });

        document.getElementById('btnReset').addEventListener('click', () => {
            clearInterval(timerInterval);
            timerInterval = null;
            startTime = 0;
            elapsedTime = 0;
            timerDisplay.textContent = "0s";
        });
    </script>
</body>
</html>
